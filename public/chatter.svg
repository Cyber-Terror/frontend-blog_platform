<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="48" fill="#070B24"/>

  <!-- Blog/document card -->
  <g filter="url(#shadow)">
    <path d="M455 245 L695 265 Q718 268 718 294 L718 510 Q718 536 692 536 L570 536 L535 510 L455 510 Q430 510 430 484 L430 274 Q430 245 455 245Z"
          fill="#F7F7FB"/>
    <rect x="582" y="318" width="105" height="14" rx="7" fill="#7772B4"/>
    <rect x="582" y="364" width="105" height="14" rx="7" fill="#7772B4"/>
    <rect x="582" y="410" width="105" height="14" rx="7" fill="#7772B4"/>
  </g>

  <!-- Chat bubble -->
  <path d="M350 292
           C278 292 222 348 222 420
           C222 475 256 522 305 541
           L292 604
           Q290 617 303 610
           L365 570
           C384 575 402 578 422 578
           C494 578 550 522 550 450
           C550 363 486 292 414 292Z"
        fill="url(#chatGradient)" filter="url(#shadow)"/>

  <!-- Inner chat area -->
  <path d="M332 352
           H427
           C465 352 494 381 494 419
           C494 457 465 486 427 486
           H367
           L334 507
           L341 479
           C316 465 301 444 301 419
           C301 381 330 352 368 352Z"
        fill="#070B24"/>

  <!-- Typing dots -->
  <circle cx="354" cy="420" r="13" fill="#FFFFFF"/>
  <circle cx="399" cy="420" r="13" fill="#FFFFFF"/>
  <circle cx="444" cy="420" r="13" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="512" y="700"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="154"
        font-weight="700"
        letter-spacing="-5"
        fill="#FFFFFF">Chatter</text>

  <!-- Tagline -->
  <text x="512" y="760"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="500"
        letter-spacing="12"
        fill="#B8B7D9">BLOG • CHAT • PEOPLE</text>
</svg>